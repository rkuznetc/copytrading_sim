# Три независимых мира. Не подбирайте параметры по тестовым результатам.
simulation_config: ../base.yaml
simulation_overrides:
  simulation:
    n_users: 200
    n_strategies: 80
    exposures_per_user: 60
    slate_size: 5
seeds: [42, 43, 44]
methods: [random, popularity_public, popularity_train, compatibility_oracle, mixed_logger, mf]
split:
  train_fraction: 0.6
  validation_fraction: 0.2
mf:
  factors: 8
  epochs: 80
  batch_size: 512
  learning_rate: 0.015
  regularization: 0.0001
  patience: 10
  min_delta: 0.00001
evaluation:
  catalog_k: [1, 3, 5, 10]
  choice_k: [1, 3]
  response_steps: 5
output:
  dir: artifacts/experiments
